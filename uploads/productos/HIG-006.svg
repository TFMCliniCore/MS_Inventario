<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <rect width="400" height="400" rx="24" fill="url(#shine)"/>

  <!-- Decorative circles -->
  <circle cx="358" cy="42" r="88" fill="white" opacity="0.06"/>
  <circle cx="42" cy="358" r="66" fill="white" opacity="0.06"/>
  <circle cx="380" cy="380" r="110" fill="white" opacity="0.04"/>
  <circle cx="12" cy="12" r="50" fill="white" opacity="0.04"/>

  <!-- Icon glow halo -->
  <circle cx="200" cy="188" r="102" fill="white" opacity="0.08" filter="url(#glow)"/>
  <circle cx="200" cy="188" r="88" fill="white" opacity="0.08"/>

  <!-- Icon -->
  
    <g opacity="0.95" transform="translate(200,200) rotate(-28) translate(-200,-200)">
      <rect x="185" y="147" width="30" height="66" rx="6" fill="white"/>
      <rect x="186" y="213" width="28" height="44" rx="4" fill="white" opacity="0.8"/>
      <line x1="188" y1="213" x2="188" y2="250" stroke="#0369a1" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/><line x1="191" y1="213" x2="191" y2="250" stroke="#0369a1" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/><line x1="194" y1="213" x2="194" y2="250" stroke="#0369a1" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/><line x1="197" y1="213" x2="197" y2="250" stroke="#0369a1" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/><line x1="200" y1="213" x2="200" y2="250" stroke="#0369a1" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/><line x1="203" y1="213" x2="203" y2="250" stroke="#0369a1" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/><line x1="206" y1="213" x2="206" y2="250" stroke="#0369a1" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/><line x1="209" y1="213" x2="209" y2="250" stroke="#0369a1" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>
    </g>

  <!-- Bottom band -->
  <rect x="0" y="296" width="400" height="104" rx="0" fill="white" opacity="0.14"/>
  <rect x="0" y="376" width="400" height="24" fill="white" opacity="0.08"/>

  <!-- Divider -->
  <line x1="32" y1="304" x2="368" y2="304" stroke="white" stroke-width="1" opacity="0.2"/>

  <!-- Code badge -->
  <rect x="14" y="14" width="90" height="30" rx="8" fill="#0c4a6e" opacity="0.88"/>
  <text x="59" y="34" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700"
        fill="#e0f2fe" text-anchor="middle" letter-spacing="0.8">HIG-006</text>

  <!-- Brand -->
  <text x="386" y="33" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic"
        fill="white" text-anchor="end" opacity="0.7">FurPet</text>

  <!-- Product name lines -->
  <text x="200" y="316" font-family="'Segoe UI',Arial,sans-serif" font-size="17"
        font-weight="600" fill="white" text-anchor="middle">Cepillo Deslizador</text>
  <text x="200" y="339" font-family="'Segoe UI',Arial,sans-serif" font-size="17"
        font-weight="600" fill="white" text-anchor="middle">Doble</text>

  <!-- Category label -->
  <text x="200" y="392" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="400"
        fill="white" text-anchor="middle" opacity="0.45" letter-spacing="2">HIGIENE Y GROOMING</text>
</svg>